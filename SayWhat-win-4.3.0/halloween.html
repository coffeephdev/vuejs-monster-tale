<!DOCTYPE html>
<html lang="en-AU">

<head>
    <meta charset="utf-8">
    <title>01 Start</title>
    <style>
        html,
        body {
            margin: 0;
        }

        article {
            max-width: 720px;
            margin: 40px auto;
            font-family: 'Times New Roman', Times, serif;
        }

        h1 {
            text-align: center;
            position: relative;
            margin-bottom: 80px;
            font-size: 40px;
            line-height: 60px;
        }

        h1:after {
            content: " ";
            display: block;
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: #ccc;
        }

        p {
            font-size: 18px;
            line-height: 22px;
            animation: fade-in 0.4s linear;
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        hr {
            border: none;
            border-bottom: 1px solid #eee;
        }

        .end {
            margin-top: 50px;
            text-align: center;
            color: #999;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            opacity: 0;
            animation: fade-in 0.5s linear;
            animation-delay: 0.2s;
            animation-fill-mode: forwards;
        }

        li {
            margin-bottom: 4px;
        }

        button {
            border: 1px solid #ddd;
            background: #f9f9f9;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            line-height: 30px;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }
    </style>
</head>
