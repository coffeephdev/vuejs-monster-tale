        }

            position: relative;
            margin-bottom: 80px;
            font-size: 40px;
            line-height: 60px;
        }

            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: #ccc;

            line-height: 22px;

            }

            text-align: center;
            color: #999;

        ul {

            margin: 0;
            padding: 0;
            opacity: 0;
            animation: fade-in 0.5s linear;
            animation-delay: 0.2s;
            animation-fill-mode: forwards;

        li {

        button {
            border: 1px solid #ddd;
            background: #f9f9f9;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            line-height: 30px;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }
    </style>
</head>

                            token["value"] = this.getStateValue(tokens[i - 1].value, typeHint) - this.getStateValue(tokens[i + 1].value, typeHint);
                            tokens.splice(i + 1, 1);
                            tokens.splice(i - 1, 1);
                            i -= 1;
                        }
                    }
                    i += 1;
                }
                return this.getStateValue(tokens[0].value);
            };
            DialogueManager.prototype.isValid = function (line) {
                if (line.type === TYPE_DIALOGUE && line.dialogue === "")
                    return false;
                if (line.type === TYPE_MUTATION && line.mutation === null)
                    return false;
                if (line.type === TYPE_RESPONSE && line.responses.length === 0)
                    return false;
                return true;
            };
            return DialogueManager;
        }());
        var DialogueLine = (function () {
            function DialogueLine(data) {
                this.type = TYPE_DIALOGUE;
                this.type = data.type;
                this.nextId = data.next_id;
                switch (this.type) {
                    case TYPE_DIALOGUE:
                        this.character = data.character;
                        this.dialogue = data.text;
                        break;
                    case TYPE_MUTATION:
                        this.mutation = data.mutation;
                        break;
                }
            }
            return DialogueLine;
        }());
        var DialogueResponse = (function () {
            function DialogueResponse(data) {
                this.prompt = data.text;
                this.nextId = data.next_id;
            }
            return DialogueResponse;
        }());
        var dialogueManager = new DialogueManager();
        if (typeof window !== "undefined") {
            window["DialogueManager"] = dialogueManager;
        }
        exports["default"] = dialogueManager;
    </script>
